name: Garimpo - teste da automação
on:
  push:
    paths:
      - 'automation/**'
      - '.github/workflows/automation-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar filtros e autorização
        working-directory: automation
        run: npm test
      - name: Iniciar e importar no n8n
        working-directory: automation
        run: bash setup.sh
      - name: Executar o fluxo dentro do container
        working-directory: automation
        run: docker compose exec -T -e N8N_RUNNERS_BROKER_PORT=5680 n8n n8n execute --id=garimpoSmartDraft01
      - name: Conferir rascunho de demonstração
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('http://127.0.0.1:8078/api/results');
          assert.equal(response.status, 200);
          const data = await response.json();
          assert.equal(data.mode, 'demo');
          assert.equal(data.count, 5);
          assert.equal(data.published, false);
          assert.ok(data.products.every(p => p.simulation && !p.affiliateUrl && !p.publishable));
          console.log('Demonstração conferida: cinco candidatos, sem links falsos e sem publicação.');
          NODE
      - name: Conferir repetição, preservação e teste guiado
        working-directory: automation
        run: |
          docker compose exec -T n8n node -e "const fs=require('node:fs');const wf=JSON.parse(fs.readFileSync('/workflows/garimpo-smart.json','utf8'));wf.name='Edicao preservada no teste';fs.writeFileSync('/tmp/garimpo-edited.json',JSON.stringify(wf));"
          docker compose exec -T n8n n8n import:workflow --input=/tmp/garimpo-edited.json
          bash setup.sh
          docker compose exec -T n8n n8n export:workflow --id=garimpoSmartDraft01 --output=/tmp/garimpo-preserved.json
          docker compose exec -T n8n node -e "const assert=require('node:assert/strict');const fs=require('node:fs');const list=JSON.parse(fs.readFileSync('/tmp/garimpo-preserved.json','utf8'));assert.equal(list[0].name,'Edicao preservada no teste');console.log('Edicao preservada.');"
          bash manage.sh test
          bash manage.sh stop
          bash manage.sh start
          bash manage.sh status
          bash manage.sh test
      - name: Encerrar serviços
        if: always()
        working-directory: automation
        run: docker compose down
