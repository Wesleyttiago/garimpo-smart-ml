<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>Garimpo Smart · Retorno da autorização</title>
<link rel="stylesheet" href="oauth-callback.css"><script src="oauth-callback.js" defer></script>
</head>
<body><main><p class="brand">Garimpo<span>Smart</span></p><p class="eyebrow">CONEXÃO COM O MERCADO LIVRE</p>
<h1 id="heading">Retorno da autorização.</h1>
<p id="message" role="status" aria-live="polite">Conferindo a resposta…</p>
<button id="copy" type="button" hidden>Copiar resposta</button>
<label id="fallback-label" for="fallback" hidden>Copie a resposta abaixo para o terminal que iniciou a conexão.</label>
<textarea id="fallback" rows="4" readonly hidden></textarea>
<p class="detail">A troca por tokens acontece no configurador local. Esta página não recebe sua senha nem a chave secreta da aplicação e não envia a resposta a outros serviços.</p>
</main></body></html>
